version: '3.8'

services:
  # FastAPI Application for testing
  app-test:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: aiops-api-test
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-test-key}
      - OPENSEARCH_HOST=opensearch-test
      - REDIS_URL=redis://redis-test:6379
      - ENVIRONMENT=test
      - LOG_LEVEL=DEBUG
    depends_on:
      opensearch-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - test-network
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./configs:/app/configs
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # OpenSearch for testing
  opensearch-test:
    image: opensearchproject/opensearch:2.11.0
    container_name: aiops-opensearch-test
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m  # Reduced memory for testing
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
    networks:
      - test-network
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis for testing
  redis-test:
    image: redis:7-alpine
    container_name: aiops-redis-test
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Test data initializer
  test-data-init:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: aiops-test-data-init
    depends_on:
      opensearch-test:
        condition: service_healthy
      app-test:
        condition: service_healthy
    networks:
      - test-network
    volumes:
      - ./tests/test_data:/test_data
      - ./scripts:/scripts
    command: >
      sh -c "pip install opensearch-py requests &&
             python /scripts/init_test_data.py"
    restart: "no"

networks:
  test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16